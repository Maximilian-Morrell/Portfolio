<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maximilian Morrell: Countdown</title>
  <link rel="stylesheet" href="../CSS/bulma.min.css">
  <link rel="stylesheet" href="../CSS/styles.css"> <!-- this is your custom CSS -->
  <link rel="icon" type="image/png" href="../images/favicon-32x32.png">
  <script src="../js/menubar.js"></script>

  <section class="section">

    <div class="box">
      <h1 class="title is-centered is-size-1 has-text-centered">Australia</h1>

        <p class="countdown subtitle is-size-2 has-text-centered" data-target="2026-07-23T15:40:00"></p>

          <span class="progress-text">0%</span>
        </div>
      </div>
    </div>
